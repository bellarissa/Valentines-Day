<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&family=Petemoss&family=Roboto:ital,wght@0,100..900;1,100..900&family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<div class="share-buttons" style="text-align: center; margin-top: 20px; padding: 10px; background: pink; border-radius: 10px;">
    <a href="https://wa.me/?text=Check out my Valentine's card! %0Ahttps://github.com/bellarissa/Valentines-Day.git target="_blank" style="margin: 0 10px; padding: 10px 15px; background: #25D366; color: white; text-decoration: none; border-radius: 5px;">WhatsApp ❤️</a>
    <a href="https://www.facebook.com/sharer/sharer.php?u=https://github.com/bellarissa/Valentines-Day.git" target="_blank" style="margin: 0 10px; padding: 10px 15px; background: #1877F2; color: white; text-decoration: none; border-radius: 5px;">Facebook 💕</a>
    <a href="https://twitter.com/intent/tweet?url=https://github.com/bellarissa/Valentines-Day.git&text=Happy Valentine's Day!" target="_blank" style="margin: 0 10px; padding: 10px 15px; background: #1DA1F2; color: white; text-decoration: none; border-radius: 5px;">Twitter 💖</a>
    <a href="#" onclick="navigator.share({title: 'My Valentine Card', url: window.location.href})" style="margin: 0 10px; padding: 10px 15px; background: #FF69B4; color: white; text-decoration: none; border-radius: 5px;">Share 🔗</a>
</div>
<body>
    <div class="envelope">
        <div class="envelope-lid"></div>
        <div class="envelope-lid envelope-lid-secondary"></div>
        <div class="card-wrapper">
            <div class="card">
                <div class="card-cover">
                    <div class="card-side card-side-primary">
                        <h1 class="card-title">
                            <span class="card-title-secondary">Happy</span>
                            <span class="card-title-main">Valentine's</span>
                            <span class="card-title-apostrophe">'</span>
                            <span class="card-title-secondary">Day!</span>
                        </h1>
                    </div>
                    <div class="card-side card-side-secondary"></div>
                </div>
                <div class="card-body">
                    <p>To my silly Adam Danish,</p>
                    <p>From the moment your basketball hit me, I instantly had a crush on you.</p>
                    <p>It was love at first sight, from being my crush to my boyfriend.</p>
                    <p>Here's to a lifetime of love and laughter!</p>
                    <p>Happy Valentine's Day!</p>
                </div>
            </div>
        </div>
        <div class="heart-seal"></div>
    </div>
</body>
</html>
